[project]
name = "ai-service"
version = "0.1.0"
description = "Standalone FastAPI scaffold for the AI service"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi[standard]>=0.115.0,<1.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "redis>=5.0.0,<6.0.0",
  "boto3>=1.34.0,<2.0.0",
  "numpy>=1.26.0,<3.0.0",
  "opencv-python-headless>=4.10.0,<5.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pillow>=10.0.0,<12.0.0",
  "tensorflow-cpu>=2.16.0,<3.0.0",
  "transformers>=4.40.0,<5.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "fakeredis>=2.21.0,<3.0.0",
  "ruff>=0.5.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
