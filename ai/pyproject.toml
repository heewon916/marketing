[project]
name = "ai-service"
version = "0.1.0"
description = "Standalone FastAPI scaffold for the AI service"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi[standard]>=0.115.0,<1.0.0",
  "pydantic-settings>=2.3.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "redis>=5.0.0,<6.0.0",
  "boto3>=1.34.0,<2.0.0",
  "numpy>=1.26.0,<3.0.0",
  "opencv-python-headless>=4.10.0,<5.0.0",
  "httpx>=0.27.0,<1.0.0",
  "onnxruntime>=1.18.0,<2.0.0",
  "pillow>=10.0.0,<12.0.0",
  "realesrgan>=0.3.0",
  "transformers>=4.40.0,<5.0.0",
  "kiwipiepy>=0.18.0,<1.0.0",
  "torch>=2.11.0",
  "openai>=2.36.0",
  "huggingface-hub>=0.36.2",
  "langgraph>=1.0,<2.0",
  "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "fakeredis>=2.21.0,<3.0.0",
  "ruff>=0.5.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
