spring.application.name=be

# .env 파일 로드 (현재 폴더 또는 루트 폴더)
spring.config.import=optional:file:.env,optional:file:.env.local,optional:file:../.env,optional:file:../.env.local

# DB 접속 설정 (.env 변수 활용)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 공통 설정
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 개발 중 임시
spring.jpa.hibernate.ddl-auto=update

# JPA Entity 기반 테이블 생성/수정 후 sql 실행
spring.jpa.defer-datasource-initialization=true

# Spring 실행 시 data.sql 자동 실행
spring.sql.init.mode=always
spring.sql.init.data-locations=optional:classpath:data.sql

# Redis 설정 (기본값은 로컬 호스트, Docker Compose 실행 시 환경변수로 오버라이드 됨)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:myredispassword}

# Instagram OAuth2 설정
spring.security.oauth2.client.registration.instagram.client-id=${INSTAGRAM_CLIENT_ID}
spring.security.oauth2.client.registration.instagram.client-secret=${INSTAGRAM_CLIENT_SECRET}
spring.security.oauth2.client.registration.instagram.redirect-uri=${OAUTH_REDIRECT_URI}
spring.security.oauth2.client.registration.instagram.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.instagram.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.instagram.scope=instagram_business_basic,instagram_business_manage_messages,instagram_business_manage_comments,instagram_business_content_publish,instagram_business_manage_insights
spring.security.oauth2.client.registration.instagram.client-name=Instagram

spring.security.oauth2.client.provider.instagram.authorization-uri=https://api.instagram.com/oauth/authorize
spring.security.oauth2.client.provider.instagram.token-uri=https://api.instagram.com/oauth/access_token
spring.security.oauth2.client.provider.instagram.user-info-uri=https://graph.instagram.com/me?fields=id,username
spring.security.oauth2.client.provider.instagram.user-name-attribute=id

# JWT 설정
jwt.secret=${JWT_SECRET}
# AccessToken 만료 시간 (1시간 = 3600000ms)
jwt.access-token-validity-in-ms=3600000
# RefreshToken 만료 시간 (14일 = 1209600000ms)
jwt.refresh-token-validity-in-ms=1209600000


# Firebase
firebase.enabled=${FIREBASE_ENABLED:false}
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:file:/run/secrets/firebase-service-account.json}

# Swagger(OpenAPI) JSON 문서 경로 설정
springdoc.api-docs.path=/api/v3/api-docs

# Swagger UI 접속 경로 설정
springdoc.swagger-ui.path=/api/swagger-ui.html

# Nginx 프록시 환경에서 경로 인식을 위한 설정
server.forward-headers-strategy=framework

# Content AI generation
content.idempotency-ttl-seconds=${CONTENT_IDEMPOTENCY_TTL_SECONDS:600}

# FastAPI AI server
ai.server.base-url=${AI_SERVER_BASE_URL:http://fastapi:8000}
ai.server.timeout-seconds=${AI_SERVER_TIMEOUT_SECONDS:10}

# Clova STT
clova.stt.base-url=${CLOVA_STT_BASE_URL:}
clova.stt.secret-key=${CLOVA_STT_SECRET_KEY:}
clova.stt.timeout-seconds=${CLOVA_STT_TIMEOUT_SECONDS:10}

# Weather context Open APIs
weather.kma-service-key=${KMA_SERVICE_KEY:}
weather.air-korea-service-key=${AIRKOREA_SERVICE_KEY:}
weather.kma-forecast-base-url=${KMA_FORECAST_BASE_URL:http://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}
weather.kma-warning-base-url=${KMA_WARNING_BASE_URL:http://apis.data.go.kr/1360000/WthrWrnInfoService}
weather.air-korea-air-base-url=${AIRKOREA_AIR_BASE_URL:http://apis.data.go.kr/B552584/ArpltnInforInqireSvc}
weather.air-korea-station-base-url=${AIRKOREA_STATION_BASE_URL:http://apis.data.go.kr/B552584/MsrstnInfoInqireSvc}
weather.cache-ttl-seconds=${WEATHER_CACHE_TTL_SECONDS:2400}
weather.warning-cache-ttl-seconds=${WARNING_CACHE_TTL_SECONDS:600}
weather.station-cache-ttl-seconds=${STATION_CACHE_TTL_SECONDS:86400}
