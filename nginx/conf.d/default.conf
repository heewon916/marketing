server {
    listen 80;
    server_name maketing.co.kr www.maketing.co.kr k14a401.p.ssafy.io;

    return 301 https://www.maketing.co.kr$request_uri;
}

server {
    listen 443 ssl;
    server_name maketing.co.kr www.maketing.co.kr k14a401.p.ssafy.io;

    ssl_certificate /etc/letsencrypt/live/maketing.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maketing.co.kr/privkey.pem;

    # Docker 내부 DNS를 30초 주기로 참조
    resolver 127.0.0.11 valid=30s;

    # 기존 api
    location /api/ {
        # 영상 전송 413 에러 방지 위해서 
        client_max_body_size 10M;

        set $spring_upstream http://spring:8080;
        proxy_pass $spring_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location = /ai/docs {
        set $fastapi_docs_upstream http://fastapi:8000/docs;
        proxy_pass $fastapi_docs_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location = /ai/openapi.json {
        set $fastapi_openapi_upstream http://fastapi:8000/ai/openapi.json;
        proxy_pass $fastapi_openapi_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location /ai/ {
        set $fastapi_upstream http://fastapi:8000;
        proxy_pass $fastapi_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
