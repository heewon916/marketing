global:
  resolve_timeout: 5m

route:
  receiver: mattermost
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 2h

receivers:
  - name: mattermost
    slack_configs:
      - api_url: "${MATTERMOST_WEBHOOK_URL}"
        username: "${MATTERMOST_USERNAME}"
        send_resolved: true
        title: "{{ if eq .Status \"firing\" }}장애 감지{{ else }}복구 확인{{ end }}: {{ .CommonLabels.alertname }}"
        text: >-
          상태: {{ .Status | toUpper }}
          심각도: {{ .CommonLabels.severity }}
          알림 수: {{ len .Alerts }}

          {{ range .Alerts }}
          ---
          요약: {{ .Annotations.summary }}
          설명: {{ .Annotations.description }}
          {{ if .Labels.instance }}대상: {{ .Labels.instance }}{{ end }}
          {{ if .Labels.name }}컨테이너: {{ .Labels.name }}{{ end }}
          시작: {{ .StartsAt }}
          {{ if .EndsAt }}종료: {{ .EndsAt }}{{ end }}

          {{ end }}
