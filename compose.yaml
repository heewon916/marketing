services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    container_name: project-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    # volumes 지시어 삭제
    depends_on:
      - spring
      - frontend
    networks:
      - project-network

  spring:
    build:
      context: ./be
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: marketing-spring:latest
    container_name: project-spring
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FASTAPI_BASE_URL: http://fastapi:8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      JWT_SECRET: ${JWT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-false}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-file:/run/secrets/firebase-service-account.json}
    volumes:
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    expose:
      - "8080"
    depends_on:
      - fastapi
      - postgres
      - redis
    networks:
      - project-network

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY}
        VITE_API_BACKEND_URL: ${VITE_API_BACKEND_URL}
    image: marketing-frontend:latest
    container_name: project-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - project-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: project-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - project-network

  redis:
    image: redis:8.4.0
    container_name: project-redis
    restart: unless-stopped
    env_file:
      - .env
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - project-network

  keyword-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: project-keyword-server
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - -m
      - /models/qwen2.5-7b-instruct/q3_k_m/model.gguf
      - -c
      - "${KEYWORD_MODEL_CTX_SIZE:-2048}"
      - --n-gpu-layers
      - "${KEYWORD_MODEL_GPU_LAYERS:-0}"
    volumes:
      # Provision the GGUF model from the host without baking it into the image.
      - ${KEYWORD_MODEL_HOST_DIR:-./.models/keyword/qwen2.5-7b-instruct/q3_k_m}:/models/qwen2.5-7b-instruct/q3_k_m:ro
    expose:
      - "8001"
    networks:
      - project-network

  fastapi:
    build:
      context: ./ai
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: marketing-fastapi:latest
    container_name: project-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      KEYWORD_MODEL_BASE_URL: ${KEYWORD_MODEL_BASE_URL:-http://keyword-server:8001}
      KEYWORD_MODEL_CHAT_ENDPOINT: ${KEYWORD_MODEL_CHAT_ENDPOINT:-/v1/chat/completions}
      KEYWORD_MODEL_TIMEOUT_SECONDS: ${KEYWORD_MODEL_TIMEOUT_SECONDS:-30.0}
      KEYWORD_MODEL_MAX_TOKENS: ${KEYWORD_MODEL_MAX_TOKENS:-64}
      KEYWORD_MODEL_TEMPERATURE: ${KEYWORD_MODEL_TEMPERATURE:-0.1}
      KEYWORD_MODEL_TOP_P: ${KEYWORD_MODEL_TOP_P:-0.9}
      KEYWORD_MODEL_ENABLED: ${KEYWORD_MODEL_ENABLED:-true}
    expose:
      - "8000"
    depends_on:
      - keyword-server
    networks:
      - project-network

volumes:
  postgres_data:
  redis_data:

networks:
  project-network:
    driver: bridge
