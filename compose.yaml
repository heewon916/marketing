services:
  nginx:
    image: nginx:1.27-alpine
    container_name: project-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - spring
      - frontend
    networks:
      - project-network
  spring:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: project-spring
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FASTAPI_BASE_URL: http://fastapi:8000
    expose:
      - "8080"
    depends_on:
      - fastapi
      - postgres
      - redis
    networks:
      - project-network
  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: project-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - project-network
  postgres:
    image: pgvector/pgvector:pg16
    container_name: project-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - project-network

  redis:
    image: redis:8.4.0
    container_name: project-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    env_file:
      - .env
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - project-network
  fastapi:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: project-fastapi
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - project-network
volumes:
  postgres_data:
  redis_data:

networks:
  project-network:
    driver: bridge
