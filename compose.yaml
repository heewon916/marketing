  fastapi:
    build:
      context: ./ai
      dockerfile: Dockerfile
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
    image: marketing-fastapi:latest
    container_name: project-fastapi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      CLOUDFRONT_DOMAIN: ${CLOUDFRONT_DOMAIN}
      KEYWORD_MODEL_BASE_URL: ${KEYWORD_MODEL_BASE_URL:-http://keyword-server:8001}
      KEYWORD_MODEL_CHAT_ENDPOINT: ${KEYWORD_MODEL_CHAT_ENDPOINT:-/v1/chat/completions}
      KEYWORD_MODEL_HEALTH_ENDPOINT: ${KEYWORD_MODEL_HEALTH_ENDPOINT:-/health}
      KEYWORD_MODEL_TIMEOUT_SECONDS: ${KEYWORD_MODEL_TIMEOUT_SECONDS:-30.0}
      KEYWORD_MODEL_MAX_TOKENS: ${KEYWORD_MODEL_MAX_TOKENS:-64}
      KEYWORD_MODEL_TEMPERATURE: ${KEYWORD_MODEL_TEMPERATURE:-0.1}
      KEYWORD_MODEL_TOP_P: ${KEYWORD_MODEL_TOP_P:-0.9}
      KEYWORD_MODEL_ENABLED: ${KEYWORD_MODEL_ENABLED:-true}
      CAPTION_MODEL_BASE_URL: ${CAPTION_MODEL_BASE_URL:-http://caption-server:8002}
      CAPTION_MODEL_CHAT_ENDPOINT: ${CAPTION_MODEL_CHAT_ENDPOINT:-/v1/chat/completions}
      CAPTION_MODEL_HEALTH_ENDPOINT: ${CAPTION_MODEL_HEALTH_ENDPOINT:-/health}
      CAPTION_MODEL_TIMEOUT_SECONDS: ${CAPTION_MODEL_TIMEOUT_SECONDS:-60.0}
      CAPTION_MODEL_MAX_TOKENS: ${CAPTION_MODEL_MAX_TOKENS:-64}
      CAPTION_MODEL_TEMPERATURE: ${CAPTION_MODEL_TEMPERATURE:-0.7}
      CAPTION_MODEL_TOP_P: ${CAPTION_MODEL_TOP_P:-0.9}
      CAPTION_MODEL_ENABLED: ${CAPTION_MODEL_ENABLED:-true}
    expose:
      - "8000"
    # Model servers run on separate EC2 instances; no compose-level dependency.
    # depends_on:
    #   - keyword-server
    #   - caption-server
    networks:
      - project-network

volumes:
  postgres_data:
  redis_data:

networks:
  project-network:
    driver: bridge
