# ============================================================
# g5.2xlarge (A10G 24GB) unified AI services
#
# GPU split plan:
#   exaone-vllm (vLLM, AWQ 7.8B): gpu-memory-utilization 0.40
#   vlm-server  (vLLM, AWQ 7B):   gpu-memory-utilization 0.45
#   headroom:                     0.15
# ============================================================

services:

  # Unified EXAONE text server for keyword extraction and caption/chat.
  exaone-vllm:
    image: vllm/vllm-openai:latest
    container_name: exaone-vllm
    ports:
      - "${EXAONE_VLLM_PORT_PRIMARY:-8000}:8000"
      - "${EXAONE_VLLM_PORT_COMPAT:-8002}:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command: >
      ${EXAONE_VLLM_MODEL:-LGAI-EXAONE/EXAONE-3.5-7.8B-Instruct-AWQ}
      --trust-remote-code
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --max-model-len ${EXAONE_VLLM_CTX:-4096}
      --gpu-memory-utilization ${EXAONE_VLLM_GPU_MEM:-0.40}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Qwen2.5-VL 7B for image analysis and final-edit planning.
  vlm-server:
    image: vllm/vllm-openai:latest
    container_name: vlm-server
    ports:
      - "${VLM_PORT:-8001}:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - huggingface-cache:/root/.cache/huggingface
    command: >
      ${VLM_MODEL:-Qwen/Qwen2.5-VL-7B-Instruct-AWQ}
      --max-model-len ${VLM_CTX:-8192}
      --gpu-memory-utilization 0.45
      --enforce-eager
      --host 0.0.0.0
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Redis for Celery broker and caching.
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  huggingface-cache:
  redis-data:
